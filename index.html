<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="공부계획">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>공부 계획 체크</title>
<script>
  // 화면 디자인: 'samsung'(기본), 'apple', 'classic'. 기기에만 저장되고, 기록 데이터와는 상관없어요.
  (function () {
    var t = 'samsung';
    try { t = localStorage.getItem('studyplan.theme') || 'samsung'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
:root{
  --bg:#f3f5f9; --card:#ffffff; --text:#1c2333; --sub:#5b6478; --line:#e2e6ee;
  --accent:#2563eb; --accent-soft:#e6eefe; --green:#16a34a; --green-soft:#e3f6ea;
  --red:#dc2626; --red-soft:#fde8e8; --orange:#ea7a0c; --orange-soft:#fff1e2;
  --gray-soft:#eef0f4; --shadow:0 2px 10px rgba(20,30,60,.07);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11151d; --card:#1b212c; --text:#e9edf5; --sub:#9aa3b5; --line:#2c3443;
    --accent:#5b8cff; --accent-soft:#1f2b47; --green:#34c26b; --green-soft:#16301f;
    --red:#f05252; --red-soft:#3a1c1e; --orange:#f59e3b; --orange-soft:#3a2a17;
    --gray-soft:#242b37; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:18px;line-height:1.5;touch-action:manipulation;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.wrap{max-width:1200px;margin:0 auto;padding:16px 20px}

/* 상단 */
.testbar{background:var(--orange);color:#fff;padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;font-weight:600}
.testbar input{background:#fff;color:#222;border:0;border-radius:10px;padding:8px 10px;min-height:48px}
.testbar button{background:#fff;color:var(--orange);border:0;border-radius:10px;padding:8px 16px;min-height:48px;font-weight:700}

.datehead{display:flex;align-items:center;gap:12px;margin:8px 0 6px}
.datehead h1{flex:1;text-align:center;margin:0;font-size:28px}
.datehead .sub{display:block;font-size:16px;font-weight:500;color:var(--sub)}
.navbtn{width:60px;height:60px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:26px;box-shadow:var(--shadow)}
.todaybtn{display:block;margin:0 auto 10px;border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:8px 20px;min-height:48px;font-weight:700}

.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 14px;font-weight:700;font-size:16px}
.b-done{background:var(--green-soft);color:var(--green)}
.b-missed{background:var(--red-soft);color:var(--red)}
.b-open{background:var(--accent-soft);color:var(--accent)}
.b-future,.b-empty{background:var(--gray-soft);color:var(--sub)}
.b-rest{background:var(--orange-soft);color:var(--orange)}
.statusline{text-align:center;margin-bottom:14px}

/* 과목 카드 */
.cards{display:grid;grid-template-columns:1fr;gap:16px}
@media (orientation:landscape) and (min-width:900px){ .cards{grid-template-columns:1fr 1fr} }
.card{background:var(--card);border-radius:20px;padding:18px 18px 12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.card-h h2{margin:0;font-size:22px}
.card-h .book{color:var(--sub);font-size:16px}
.card-meta{color:var(--sub);font-size:15px;margin-bottom:10px}
.bar{height:8px;background:var(--gray-soft);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.unit{border-top:1px solid var(--line);padding:12px 0}
.unit-title{font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.unit-sub{font-size:15px;color:var(--sub);font-weight:600;width:100%}
.radio{display:flex;gap:12px;align-items:flex-start;min-height:60px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;margin-bottom:10px;text-align:left;width:100%;background:var(--card)}
.radio.on{border-color:var(--accent);background:var(--accent-soft)}
.radio .dot{flex:none;width:28px;height:28px;border-radius:50%;border:3px solid #b6bfce;margin-top:2px}
.radio.on .dot{border:9px solid var(--accent)}
.preview{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15px;background:var(--bg)}
.preview div{padding:4px 0;border-bottom:1px solid var(--line)}
.tag{font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--orange-soft);color:var(--orange)}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tasks .chk:only-child{grid-column:1 / -1}
@media (max-width:520px){.tasks{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 18px 8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);text-align:left;font-weight:600}
.chk .box{flex:none;width:36px;height:36px;border-radius:10px;border:3px solid #b6bfce;display:flex;align-items:center;justify-content:center;font-size:22px;color:transparent;font-weight:900}
.chk.on{border-color:var(--green);background:var(--green-soft)}
.chk.on .box{background:var(--green);border-color:var(--green);color:#fff}
.chk.prev{opacity:.55}
.chk.locked{cursor:default}
.chk.miss{border-color:var(--red)}
.empty{color:var(--sub);padding:10px 0 14px}

/* 마감 */
.closebox{margin:22px 0 8px;text-align:center}
.bigbtn{border:0;border-radius:18px;min-height:68px;padding:12px 36px;font-size:22px;font-weight:800;background:var(--accent);color:#fff;box-shadow:var(--shadow)}
.bigbtn.ghost{background:var(--card);color:var(--accent);border:2px solid var(--accent)}
.bigbtn.danger{background:var(--red)}
.btnrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px}
.result{background:var(--card);border-radius:20px;padding:20px;border:1px solid var(--line);margin:20px 0;box-shadow:var(--shadow)}
.result h3{margin:0 0 10px;font-size:22px}
.result.ok{border-color:var(--green)} .result.bad{border-color:var(--red)}
.result ul{margin:6px 0 14px;padding-left:22px}
.result textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:12px;resize:vertical}
.hint{color:var(--sub);font-size:15px}
.notice{background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:12px 16px;margin:10px 0;font-weight:600}
.notice.warn{background:var(--orange-soft);color:var(--orange)}

/* 설정 */
.sec{background:var(--card);border-radius:20px;padding:20px;margin-bottom:18px;border:1px solid var(--line);box-shadow:var(--shadow)}
.sec h2{margin:0 0 12px;font-size:22px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-weight:700;margin-bottom:6px;font-size:16px}
.field input,.field select{width:100%;min-height:54px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:8px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:52px;padding:8px 18px;font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.red{color:var(--red);border-color:var(--red)}
.subrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.subrow .nm{flex:1;min-width:180px}
.subrow .nm b{display:block}
.subrow .nm small{color:var(--sub)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.toggle{width:72px;height:42px;border-radius:99px;border:0;background:#c3cad6;position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:34px;height:34px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--orange)} .toggle.on::after{left:34px}
.tasklist .trow{display:flex;gap:8px;margin-bottom:8px}
.tasklist .trow input{flex:1}
.tasklist .trow button{width:54px}

/* 달력 */
.calwrap{display:grid;grid-template-columns:1fr;gap:18px}
@media (orientation:landscape) and (min-width:900px){ .calwrap{grid-template-columns:1.15fr 1fr;align-items:start} .calside{position:sticky;top:12px} }
.month h3{margin:6px 0 10px;font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:14px;font-weight:700;color:var(--sub);padding:2px 0}
.cal .wd:first-child{color:var(--red)} .cal .wd:nth-child(7){color:var(--accent)}
.cell{min-height:66px;border-radius:12px;border:2px solid transparent;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;font-weight:700;box-shadow:var(--shadow)}
.cell .n{font-size:16px} .cell .i{font-size:20px;line-height:1}
.cell.out{background:transparent;box-shadow:none;color:var(--line);cursor:default}
.cell.s-done{background:var(--green-soft)} .cell.s-missed{background:var(--red-soft)}
.cell.s-rest{background:var(--orange-soft)} .cell.s-paused{background:var(--gray-soft);color:var(--sub)} .cell.s-open{background:var(--accent-soft)}
.cell.today{border-color:var(--accent)}
.cell.sel{border-color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:15px;color:var(--sub);margin:4px 0 14px}
.fc{padding:12px 0;border-top:1px solid var(--line)}
.fc:first-of-type{border-top:0}
.fc b{font-size:18px}
.fc .line{font-size:16px;margin-top:2px}
.ok{color:var(--green);font-weight:700} .bad{color:var(--red);font-weight:700}
.detail h3{margin:0 0 6px;font-size:22px}
.dsub{margin-top:14px}
.dsub h4{margin:0 0 6px;font-size:18px}
.dsub ul{margin:0;padding-left:4px;list-style:none}
.dsub li{padding:3px 0}
.memo{background:var(--bg);border-radius:12px;padding:10px 14px;margin-top:12px;white-space:pre-wrap}

/* 기간·요일 / 쉬는 날 */
.period{border:1px solid var(--line);border-radius:14px;padding:12px 12px 4px;margin-bottom:10px;background:var(--bg)}
.period input{background:var(--card)!important}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.wk label{display:flex;flex-direction:column;align-items:center;font-size:14px;font-weight:700;gap:4px}
.wk input{width:100%;min-height:52px;text-align:center;border-radius:10px;border:1px solid var(--line);padding:4px}
.wkbtns{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wkb{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700}
.wkb.on{background:var(--orange-soft);border-color:var(--orange);color:var(--orange)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 14px;border-radius:99px;background:var(--orange-soft);color:var(--orange);font-weight:700}
.chip button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.07);color:inherit;font-size:18px}

/* 통계 */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
@media (max-width:640px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.tile .k{color:var(--sub);font-weight:700;font-size:16px}
.tile .v{font-size:40px;font-weight:800;line-height:1.2;margin:4px 0}
.tile .d{color:var(--sub);font-size:15px}
.srow{padding:12px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.srow .top b{font-size:18px}
.srow .bar{margin:8px 0 4px}
.planbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.planbar button{flex:none;min-height:48px;padding:6px 18px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:700;color:var(--sub)}
.planbar button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.npq{display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%;padding:4px 0 2px}
.npq label{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px}
.npq input{width:84px;min-height:50px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pick .wkb{padding:0 16px}

/* 복습 */
.revsec h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;gap:8px;align-items:stretch}
.revrow .chk{flex:1}
.chk .lbl{display:flex;flex-direction:column;gap:2px}
.chk .lbl small{font-weight:500;color:var(--sub);font-size:14px}
.chk.overdue{border-color:var(--red);background:var(--red-soft)}
.chk.overdue .lbl b{color:var(--red)}
.chk.overdue.on{border-color:var(--green);background:var(--green-soft)}
.howbtn{flex:none;min-width:72px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.howbtn.sm{min-height:40px;padding:4px 12px;border-radius:99px;font-size:14px}
.howbox{background:var(--accent-soft);border-radius:12px;padding:10px 14px 10px 4px;margin:6px 0 2px;font-size:16px}
.howbox ol{margin:0;padding-left:28px}
.kind{font-size:13px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--gray-soft);color:var(--sub);align-self:flex-start}

/* 오늘 화면 구역 */
.zone{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 12px;font-size:23px}
.zone .sum{font-size:16px;font-weight:700;color:var(--sub)}
.mins{flex:none;align-self:center;font-size:14px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--gray-soft);color:var(--sub);white-space:nowrap}
.chk.on .mins{background:transparent}
.summary{display:flex;justify-content:center;gap:8px 18px;flex-wrap:wrap;font-weight:700;color:var(--sub);margin:-4px 0 6px}
.minrow{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.minrow input{min-height:50px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--bg)}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50}
.modal .sec{width:100%;max-width:640px;margin:0}

/* 하단 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:40}
.tabs button{flex:1;border:0;background:none;min-height:76px;font-size:16px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button .ic{font-size:26px}
.tabs button.on{color:var(--accent)}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#222a38;color:#fff;padding:14px 22px;border-radius:14px;font-weight:600;z-index:60;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* ===================================================================
   🎨 삼성 스타일 (DESIGN 문서 기준) — html[data-theme="samsung"] 일 때만 적용
   흰 캔버스 + #f7f7f7 면, 검정 글씨, 검정 알약 버튼(20px), 그림자 없음, 2px 점선 포커스.
   상태 색(초록 ✅ / 빨강 ❌ / 주황 테스트 모드)은 앱 기능에 필요해서 그대로 둠.
   =================================================================== */
html[data-theme="samsung"]{
  --bg:#ffffff; --card:#f7f7f7; --text:#000000; --sub:#707070; --line:#dddddd;
  --accent:#000000; --accent-soft:#efefef; --gray-soft:#ececec; --shadow:none; --navblue:#006bea; --chip:#ffffff;
}
@media (prefers-color-scheme: dark){
  html[data-theme="samsung"]{
    --bg:#000000; --card:#161616; --text:#ffffff; --sub:#a3a3a3; --line:#333333;
    --accent:#ffffff; --accent-soft:#242424; --gray-soft:#262626; --navblue:#5b9dff; --chip:#0b0b0b;
  }
}
html[data-theme="samsung"] body{font-family:"SamsungOneKorean","SamsungOne","Samsung Sans",system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;letter-spacing:-0.2px}
html[data-theme="samsung"] :focus-visible{outline:2px dotted var(--text);outline-offset:1px}
html[data-theme="samsung"] h1,html[data-theme="samsung"] h2,html[data-theme="samsung"] h3{font-weight:700;letter-spacing:-0.4px}
/* 면: 그림자·테두리 없이 흰 바탕 위 #f7f7f7, 20px 모서리 */
html[data-theme="samsung"] .card,html[data-theme="samsung"] .sec,html[data-theme="samsung"] .tile,html[data-theme="samsung"] .result{border:0;border-radius:20px;box-shadow:none}
html[data-theme="samsung"] .result.ok{box-shadow:inset 0 0 0 2px var(--green)}
html[data-theme="samsung"] .result.bad{box-shadow:inset 0 0 0 2px var(--red)}
html[data-theme="samsung"] .modal .sec{background:var(--bg)}
html[data-theme="samsung"] .zone{font-size:24px}
/* 버튼: 검정 알약(채움) / 테두리 알약(누르면 반전) */
html[data-theme="samsung"] .bigbtn{border-radius:999px;background:var(--accent);color:var(--bg);border:1px solid var(--accent);box-shadow:none;font-weight:700;font-size:19px}
html[data-theme="samsung"] .bigbtn.ghost,html[data-theme="samsung"] .btn,html[data-theme="samsung"] .todaybtn,html[data-theme="samsung"] .howbtn{background:transparent;color:var(--text);border:1px solid var(--text);border-radius:999px;font-weight:700}
html[data-theme="samsung"] .bigbtn.ghost:active,html[data-theme="samsung"] .btn:active,html[data-theme="samsung"] .todaybtn:active,html[data-theme="samsung"] .howbtn:active{background:var(--text);color:var(--bg)}
html[data-theme="samsung"] .btn.pri{background:var(--accent);color:var(--bg);border-color:var(--accent)}
html[data-theme="samsung"] .btn.red{color:var(--red);border-color:var(--red)}
html[data-theme="samsung"] .btn.red:active{background:var(--red);color:#fff}
html[data-theme="samsung"] .bigbtn.danger{background:var(--red);border-color:var(--red);color:#fff}
html[data-theme="samsung"] .navbtn{background:var(--card);border:0;box-shadow:none}
html[data-theme="samsung"] .navbtn:active{background:var(--text);color:var(--bg)}
/* 체크 항목 */
html[data-theme="samsung"] .chk{background:var(--chip);border:1px solid var(--line);border-radius:16px}
html[data-theme="samsung"] .chk .box{border-radius:50%;border-width:2px;border-color:#9a9a9a}
html[data-theme="samsung"] .chk.on{border-color:var(--green);background:var(--green-soft)}
html[data-theme="samsung"] .chk.overdue{border-color:var(--red);background:var(--red-soft)}
html[data-theme="samsung"] .chk.miss{border-color:var(--red)}
html[data-theme="samsung"] .bar{height:6px;background:var(--line)}
html[data-theme="samsung"] .bar>i{background:var(--text)}
/* 칩·배지·선택 */
html[data-theme="samsung"] .badge,html[data-theme="samsung"] .kind,html[data-theme="samsung"] .mins{border-radius:999px}

<!-- ===================================================================
     밀림 계산 로직 (화면 코드와 분리됨, tests.js 가 이 부분만 꺼내서 테스트함)
     =================================================================== -->
<script id="logic">
var StudyLogic = (function () {
  'use strict';
  var DAY = 86400000;

  /* ---------- 날짜 도우미 (항상 'YYYY-MM-DD' 문자열) ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function parseDate(s) { var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function fmtDate(t) { var d = new Date(t); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function addDays(s, n) { return fmtDate(parseDate(s) + n * DAY); }
  function weekday(s) { return new Date(parseDate(s)).getUTCDay(); } // 0=일 ... 6=토
  function diffDays(a, b) { return Math.round((parseDate(b) - parseDate(a)) / DAY); }

  /* ---------- 과목 → 진도 줄(묶음 목록) ---------- */
  function itemId(sid, u, t) { return sid + '|' + u + '|' + t; }
  function unitTitle(s, i) {
    var n = i + 1, name = s.unitName || '';
    return /^[A-Za-z]/.test(name) ? name + ' ' + n : n + name;
  }
  // 묶음(unit) = { index, title, items:[{id,label}] }
  function unitsOf(s) {
    var units = [];
    if (s.type === 'table') {
      (s.rows || []).forEach(function (r, i) {
        units.push({ index: i, title: (r.day || i + 1) + '일차', sub: r.title, row: r, skip: !!(s.fiveStep && isFiveSkip(r)),
          items: r.items.map(function (lbl, k) { return { id: itemId(s.id, i, k), label: lbl }; }) });
      });
    } else {
      // 번호형 / 간격 복습형(영단어): 단위마다 세부 할 일 (간격 복습형은 Day 하나가 체크 1개)
      var tasks = s.type === 'spaced' ? [] : (s.tasks || []).filter(function (t) { return t && String(t).trim(); });
      var total = Math.max(0, s.total | 0);
      for (var i = 0; i < total; i++) {
        var title = unitTitle(s, i);
        units.push({
          index: i, title: title,
          items: tasks.length
            ? tasks.map(function (t, k) { return { id: itemId(s.id, i, k), label: t }; })
            : [{ id: itemId(s.id, i, 0), label: title }]
        });
      }
    }
    return units;
  }

  /* ---------- CSV 진도표 읽기 ----------
     열: 일차, 과목, 단원, 교재, 학습방법, 진도  (한 줄 = 1일차 = 진도 묶음 하나) */
  function parseCSV(text) {
    text = String(text).replace(/^﻿/, '');
    var rows = [], row = [], cell = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return x.trim() !== ''; }); });
  }
  // 학습방법 + 진도 → 체크 항목 목록
  function itemsFor(method, range) {
    method = method.trim(); range = range.trim();
    var lec = /^강의\s*듣고\s*(.*)$/.exec(method);
    if (lec) {
      var review = lec[1].trim() || '복습';
      var m = /^(\d+)\s*강?\s*[-~]\s*(\d+)\s*강?$/.exec(range) || /^(\d+)\s*강?$/.exec(range);
      if (m) {
        var a = +m[1], b = m[2] ? +m[2] : a, w = m[1].length, out = [];
        for (var n = Math.min(a, b); n <= Math.max(a, b); n++) {
          var name = (String(n).length < w ? new Array(w - String(n).length + 1).join('0') : '') + n + '강';
          out.push(name + ' 강의 듣기', name + ' ' + review);
        }
        return out;
      }
      return ['강의 듣기 ' + range, review + ' ' + range];
    }
    return [(method + ' ' + range).trim()];
  }
  // CSV 글 → 진도 묶음 목록 { rows:[{day,title,method,range,items}], errors:[] }
  function rowsFromCSV(text) {
    var table = parseCSV(text), errors = [];
    if (!table.length) return { rows: [], errors: ['내용이 비어 있어요'] };
    var head = table[0].map(function (h) { return h.trim(); });
    var col = {};
    ['일차', '과목', '단원', '교재', '학습방법', '진도'].forEach(function (k) { col[k] = head.indexOf(k); });
    var missing = Object.keys(col).filter(function (k) { return col[k] < 0; });
    if (missing.length) return { rows: [], errors: ['첫 줄에 이 열이 없어요: ' + missing.join(', ')] };
    var rows = [];
    table.slice(1).forEach(function (r, i) {
      var g = function (k) { return (r[col[k]] || '').trim(); };
      if (!g('학습방법') && !g('진도')) { errors.push((i + 2) + '번째 줄: 학습방법/진도가 비어 있어 건너뜀'); return; }
      rows.push({
        day: parseInt(g('일차'), 10) || null,
        title: [g('과목'), g('단원'), g('교재')].filter(Boolean).join(' · '),
        method: g('학습방법'), range: g('진도'),
        items: itemsFor(g('학습방법'), g('진도'))
      });
    });
    rows.sort(function (a, b) { return (a.day || 0) - (b.day || 0); });
    return { rows: rows, errors: errors };
  }

  /* ---------- 복습 규칙 ---------- */
  var FIVE_DAYS = [14, 28, 42, 56];                // 수학 5단계 복습 2차~5차 (완료한 날 기준)
  // 5단계 방식에서 진도 줄에서 빼는 일차: "2차 복습", "취집공 3차 복습", "취집공 4차 복습" 등
  function isFiveSkip(row) { var m = (row.method || '').trim(); return !/^강의/.test(m) && /차\s*복습$/.test(m); }
  function isLectureRow(row) { return /^강의\s*듣고/.test((row.method || '').trim()); }
  function spacedOf(s) { return (s.spaced || []).map(Number).filter(function (n) { return n > 0; }); }

  /* ---------- 하루 분량 ---------- */
  // 쉬는 날: 날짜로 지정(restDays) 또는 매주 요일로 지정(restWeekdays, 0=일 ~ 6=토)
  function isRestDay(plan, date) {
    return (plan.restDays || []).indexOf(date) >= 0 || (plan.restWeekdays || []).indexOf(weekday(date)) >= 0;
  }
  // 하루 분량: 과목의 기간 규칙(periods) 중 그 날짜가 들어가는 것 → 요일별 분량. 없으면 기본 분량(daily)
  //   period = { from:'YYYY-MM-DD', to:'YYYY-MM-DD', days:[일,월,화,수,목,금,토] }
  function periodFor(s, date, ignoreEnd) {
    var ps = s.periods || [];
    for (var i = 0; i < ps.length; i++) if (ps[i].from <= date && date <= ps[i].to) return ps[i];
    // 종료일 뒤 예상(예상 완료일)에서는 마지막 기간 규칙을 그대로 이어서 씀
    if (ignoreEnd && ps.length) {
      var lastP = ps.reduce(function (a, b) { return b.to > a.to ? b : a; });
      if (date > lastP.to) return lastP;
    }
    return null;
  }
  // 일시정지: 다른 계획을 쓰는 동안 (pauses = [{from, to}], to 가 null 이면 아직 정지 중)
  function isPaused(plan, date) {
    return (plan.pauses || []).some(function (q) { return date >= q.from && (!q.to || date <= q.to); });
  }
  // 하는 요일: weekdays = [일,월,화,수,목,금,토] true/false (없으면 매일)
  function doesDay(s, date) { return !s.weekdays || !!s.weekdays[weekday(date)]; }
  function quotaFor(plan, s, date, ignoreEnd) {
    if (date < plan.start || (date > plan.end && !ignoreEnd)) return 0;
    if (isPaused(plan, date)) return 0;
    if (isRestDay(plan, date) && s.type !== 'spaced') return 0;   // 쉬는 날에도 영단어(간격 복습형)는 함
    if (!doesDay(s, date)) return 0;
    var per = periodFor(s, date, ignoreEnd && date > plan.end);
    var n = per ? per.days[weekday(date)] : s.daily;
    return Math.max(0, n | 0);
  }

  /* ---------- 핵심: 줄 앞에서부터 "안 끝난 묶음 n개"의 남은 항목 고르기 ----------
     mode 'A' : 일부만 한 묶음도 1자리를 차지 (기본)
     mode 'B' : 일부만 한 묶음의 남은 항목은 자리를 차지하지 않고 덤으로 붙음  */
  function pickItems(units, done, n, mode) {
    var out = [], count = 0;
    for (var i = 0; i < units.length && count < n; i++) {
      if (units[i].skip) continue;
      var items = units[i].items;
      var rem = items.filter(function (it) { return !done.has(it.id); });
      if (!rem.length) continue;
      var partial = rem.length < items.length;
      rem.forEach(function (it) { out.push(it.id); });
      if (!(mode === 'B' && partial)) count++;
    }
    return out;
  }

  function flatten(shown) {
    var all = [];
    Object.keys(shown).forEach(function (k) { all = all.concat(shown[k]); });
    return all;
  }

  /* ---------- 시뮬레이션: 계획 시작일부터 하루씩 진행 ----------
     today : 오늘 날짜
     until : 어디까지 계산할지 (기본 = today, 미래면 '예상')
     opts.autoClose : today 이전의 마감 안 된 날을 자동 마감
     opts.closeDate : 이 날짜를 마감
     반환: { days:[{date, shown, items, missed, carried, status, rest, closed}], done, closedCount } */
  function simulate(plan, today, until, opts) {
    opts = opts || {};
    until = until || today;
    var subs = plan.subjects.map(function (s) { return { s: s, units: unitsOf(s) }; });
    var subById = {}, known = new Set(), remain = {}, unitLeft = {}, finish = {}, atEnd = null;
    subs.forEach(function (x) {
      subById[x.s.id] = x;
      remain[x.s.id] = 0;
      x.units.forEach(function (u) {
        unitLeft[x.s.id + '|' + u.index] = u.items.length;
        u.items.forEach(function (it) { known.add(it.id); if (!u.skip) remain[x.s.id]++; });
      });
    });
    var done = new Set();
    // 복습: 묶음(강·일차)을 실제로 끝낸 날짜를 기준으로 만든다

  /* ---------- 복습 예상 시간 (분) ----------

<script>
(function () {

  var testMode = localStorage.getItem(MODEKEY) === '1';
  var data;
  var ui = { tab: 'today', viewDate: null, editDate: null, modal: null, lastToday: null };

  /* ---------- 기본 도우미 ---------- */
  function uid() { return 's' + Math.random().toString(36).slice(2, 9); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function realToday() { var d = new Date(); return d.getFullYear() + '-' + L.pad(d.getMonth() + 1) + '-' + L.pad(d.getDate()); }
  function today() { return testMode ? data.testToday : realToday(); }

    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600);
  }

  /* ---------- 예시 데이터 ---------- */
  function sampleData(start) {
    var end = '2027-02-28';
    if (end <= start) end = L.addDays(start, 60);
    var p = {
      id: 'p' + Date.now(), name: '겨울방학 계획', start: start, end: end, restDays: [], days: {}, carry: {},
      subjects: [
        mathSubject(),
        { id: uid(), type: 'numbered', name: '국어 인강', book: '국어 개념 강좌', unitName: '강', total: 40, daily: 2, tasks: ['강의 듣기', '복습'] },
        { id: uid(), type: 'numbered', name: '영어 인강', book: '영어 개념 강좌', unitName: '강', total: 30, daily: 1, tasks: ['강의 듣기', '복습'] },
        { id: uid(), type: 'numbered', name: '영단어', book: '수능 영단어', unitName: 'Day', total: 40, daily: 1, tasks: [] }

    applyWeeklySetup(p);
    applyReviewSetup(p);

  }
  // 요일별 과목 기본 설정 (A단계): 이름으로 과목을 찾아 하는 요일을 넣고, 없는 과목은 새로 추가
  function WK(str) { return [0, 1, 2, 3, 4, 5, 6].map(function (i) { return str.indexOf('일월화수목금토'[i]) >= 0; }); }
  // 복습 기본 설정 (B단계)
  function applyReviewSetup(p) {
    p.subjects.forEach(function (s) {
      if (/국어/.test(s.name) || (/영어/.test(s.name) && !/단어/.test(s.name))) {
        s.spaced = [3, 7]; s.skim = true; s.weekly = true; if (s.weeklyMin == null) s.weeklyMin = 30;
      } else if (/통합사회|통합과학|한국사/.test(s.name)) {
        s.weekly = true; if (s.weeklyMin == null) s.weeklyMin = 30;
      } else if (s.type === 'table' && /수학/.test(s.name)) {
        s.fiveStep = true;
      }
    });
  }
  // 영단어 → 간격 복습형 (C단계). 체크 기록은 그대로 이어짐 (Day 하나 = 체크 1개는 같음)
  function applyWordSetup(p) {
    p.subjects.forEach(function (s) {
      if (s.type === 'numbered' && /단어/.test(s.name) && !(s.tasks || []).filter(Boolean).length) {
        s.type = 'spaced'; s.unitName = 'Day'; s.tasks = [];
        if (s.words == null) s.words = 50;
        if (!s.spaced || !s.spaced.length) s.spaced = [1, 3, 7];
      }
    });
  }
  function applyWeeklySetup(p) {
    var find = function (re, not) { return p.subjects.filter(function (s) { return re.test(s.name) && !(not && not.test(s.name)); })[0]; };

    set(find(/영단어|단어/), '일월화수목금토');

  }

  var MATH_FILE = 'math_curriculum.csv';

  /* 저장소의 CSV 파일 읽기 (GitHub Pages 에서 동작) */

      return r.text();

  function ensureRows() {
    var p = plan(); if (!p) return;
    p.subjects.forEach(function (s) {
      if (s.type !== 'table' || (s.rows && s.rows.length) || !s.src || csvState[s.id] === 'loading') return;

        var res = L.rowsFromCSV(text);

  /* ---------- 저장 / 불러오기 ---------- */
  function load() {
    var raw = localStorage.getItem(testMode ? TKEY : KEY);
    try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }
    if (!data) {
      if (testMode) {
        var r = localStorage.getItem(KEY);
        data = r ? JSON.parse(r) : sampleData(realToday());
        data.testToday = realToday();
      } else {
        data = sampleData(realToday());
      }
      save();
    }
    if (testMode && !data.testToday) data.testToday = realToday();
    if (!data.addedMath) {
      data.plans.forEach(function (p) {
        if (!p.subjects.some(function (s) { return s.type === 'table'; })) p.subjects.unshift(mathSubject());
      });
      data.addedMath = true; save();
    }
    upgradeData();
    if (!data.setupA) { applyWeeklySetup(plan()); data.setupA = true; save(); }
    if (!data.setupB) { applyReviewSetup(plan()); data.setupB = true; save(); }
    if (!data.setupC) { applyWordSetup(plan()); data.setupC = true; save(); }
    ensureRows();
  }
  // 예전 버전 데이터 맞추기: '보관된 계획' → '일시정지된 계획'
  function upgradeData() {
    data.plans.forEach(function (p) {
      if (p.archivedAt) {
        p.pauses = (p.pauses || []).concat([{ from: p.archivedAt, to: null }]);
        delete p.archivedAt; save();
      }
    });
  }
  function save() { localStorage.setItem(testMode ? TKEY : KEY, JSON.stringify(data)); }

  /* 지난 날 자동 마감 */
  function runAutoClose(silent) {

    var n = L.autoClose(p, today());

  /* ---------- 렌더링 ---------- */
  function render() {

    h += '<nav class="tabs">' +
      tabBtn('today', '✅', '오늘') + tabBtn('calendar', '🗓️', '달력') + tabBtn('stats', '📊', '통계') + tabBtn('settings', '⚙️', '설정') + '</nav>';
    if (ui.modal) h += ui.modal();

  }
  function tabBtn(id, ic, label) {
    return '<button data-act="tab" data-tab="' + id + '" class="' + (ui.tab === id ? 'on' : '') + '"><span class="ic">' + ic + '</span>' + label + '</button>';
  }

  var STATUS = {
    done: ['b-done', '✅ 다 했어요'], missed: ['b-missed', '❌ 못 한 게 있어요'], open: ['b-open', '✏️ 진행 중'],
    future: ['b-future', '⏳ 아직 안 온 날 (예상)'], rest: ['b-rest', '💤 쉬는 날'], empty: ['b-empty', '할 일 없음'],
    paused: ['b-empty', '⏸️ 다른 계획을 쓰던 날 (일시정지)']

  function renderToday() {
    var p = plan(), t = today();
    var d = ui.viewDate || t;
    var h = '';
    if (data.plans.length > 1) {
      h += '<div class="planbar">' + data.plans.map(function (x) {
        return '<button class="' + (x.id === p.id ? 'on' : '') + '" data-act="useplan" data-id="' + x.id + '">' + (x.id === p.id ? '✅ ' : '') + esc(x.name) + '</button>';
      }).join('') + '</div>';
    }
    h += '<div class="datehead"><button class="navbtn" data-act="prev" aria-label="이전 날">‹</button>' +
      '<h1>' + korDate(d) + '<span class="sub">' + (d === t ? '오늘' : (d < t ? L.diffDays(d, t) + '일 전' : L.diffDays(t, d) + '일 후')) + ' · ' + esc(p.name) + '</span></h1>' +
      '<button class="navbtn" data-act="next" aria-label="다음 날">›</button></div>';
    if (d !== t) h += '<button class="todaybtn" data-act="gotoday">오늘로 돌아가기</button>';

    if (d < p.start) return h + '<div class="notice">계획 시작 전이에요. 계획은 ' + korDate(p.start) + '에 시작해요.</div>';
    if (d > p.end) return h + '<div class="notice">계획 기간(' + korDate(p.end) + '까지)이 끝났어요. 설정에서 종료일을 바꿀 수 있어요.</div>';

    var sim = L.simulate(p, t, d);
    var day = sim.days[sim.days.length - 1];
    var doneNow = L.simulate(p, t, t).done; // 실제로 지금까지 한 것
    var rec = p.days[d] || { checked: {} };
    var editing = ui.editDate === d;
    var st = STATUS[day.status];
    h += '<div class="statusline"><span class="badge ' + st[0] + '">' + st[1] + '</span></div>';
    if (day.status === 'future') h += '<div class="notice">지금 진도를 기준으로, 그때까지 계획대로 했을 때의 예상 할 일이에요.</div>';
    if (editing) h += '<div class="notice warn">✏️ 체크 고치는 중이에요. 고치면 이후 계획이 다시 계산돼요.</div>';

    // 이 날짜 이전까지 완료된 것 (지난 날 화면에서 "원래 이미 했던 것" 표시용)
    var doneBefore = d > p.start ? L.simulate(p, t, L.addDays(d, -1)).done : new Set();

        lag.forEach(function (x) {
          var nx = L.nextDoDay(p, x.s, d);
          h += '<div class="subrow"><div class="nm"><b>' + esc(x.s.name) + '</b><small>밀린 항목 ' + day.behind[x.s.id] + '개' +
            (nx.date ? ' · 원래 다음 차례: ' + korDate(nx.date) : '') + '</small></div>' +
            '<button class="btn pri" data-act="pull" data-id="' + x.s.id + '">⤴ 당겨오기</button></div>';
        });
        h += '</div>';
      }
    }

    var offList = [];
    var newCount = Object.keys(day.shown).filter(function (k) { return k !== '_rev'; }).reduce(function (a, k) { return a + day.shown[k].length; }, 0);
    var rsum = reviewSummary(p, sim, day, rec);
    if (newCount || rsum.list.length) {
      h += '<div class="summary"><span>📘 새로 배울 것 ' + newCount + '개</span><span>🔁 복습 ' + rsum.list.length + '개' +
        (rsum.list.length ? ' (⏱ ' + fmtMin(rsum.total) + ')' : '') + '</span></div>';
    }
    h += '<h2 class="zone">📘 새로 배울 것</h2>';
    if (!newCount && !day.rest) h += '<p class="hint">오늘은 새로 배울 진도가 없어요.</p>';
    h += '<div class="cards">';
    sim.subs.forEach(function (x) {

      h += '<div class="bar"><i style="width:' + (pr.totalUnits ? Math.round(pr.doneUnits / pr.totalUnits * 100) : 0) + '%"></i></div>';
      if (!ids.length) {

      }

      var groups = [], byUnit = {};

        var u = +id.split('|')[1];
        if (!byUnit[u]) { byUnit[u] = []; groups.push(u); }
        byUnit[u].push(id);
      });
      groups.forEach(function (u) {
        var unit = x.units[u];
        var carried = byUnit[u].some(function (id) { return day.carried.indexOf(id) >= 0; });
        var hk = 'L|' + s.id + '|' + u, lect = unit.row && /^강의\s*듣고/.test(unit.row.method || '');

          (lect ? '<button class="howbtn sm" data-act="how" data-k="' + esc(hk) + '">📖 1차 복습 방법</button>' : '') +
          (unit.sub ? '<span class="unit-sub">' + esc(unit.sub) + '</span>' : '') + '</div>' + (lect && ui.how && ui.how[hk] ? HOW : '') + '<div class="tasks">';
        byUnit[u].forEach(function (id) {
          var k = +id.split('|')[2], it = unit.items[k];
          var on, cls = 'chk', note = '';
          if (day.status === 'future') { on = false; cls += ' locked'; }

          h += '<button class="' + cls + '" data-act="toggle" data-id="' + esc(id) + '"><span class="box">✓</span><span>' + esc(lbl) + esc(note) + '</span></button>';
        });
        h += '</div></div>';
      });
      h += '</div>';
    });
    h += '</div>';
    h += renderReviews(p, sim, day, rec, editing);
    if (offList.length) h += '<p class="hint" style="margin-top:14px">😌 오늘 안 하는 과목: ' + offList.join(', ') + '</p>';

    var closedN = Object.keys(p.days).filter(function (k) { return p.days[k].closed; }).length;

      ? '<div class="notice warn" style="margin-top:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span style="flex:1;min-width:200px">💾 ' +
        (since == null ? '아직 백업한 적이 없어요.' : '마지막 백업이 ' + since + '일 전이에요.') + ' 기록이 사라지지 않게 백업해 두세요.</span>' +

    if (day.status === 'future') return h;
    if (!day.closed) {
      var left = day.missed.length;
      h += '<div class="closebox"><div class="hint">' + (day.rest && !day.items.length ? '💤 쉬는 날이에요. 진도는 멈춰 있어요.' : day.rest ? '💤 쉬는 날 · 복습과 영단어만 해요. ' + (day.missed.length ? '남은 항목 ' + day.missed.length + '개' : '🎉 다 했어요!') : day.items.length ? (left ? '남은 항목 ' + left + '개' : '🎉 오늘 할 일을 다 했어요!') : '') + '</div>' +
        '<div class="btnrow"><button class="bigbtn" data-act="close">오늘 마감</button></div>' +
        '<div class="hint" style="margin-top:8px">마감하면 못 한 항목은 다음 날로 넘어가요. 마감하지 않아도 날짜가 지나면 자동으로 마감돼요.</div></div>';
      return h + backupTip;
    }
    if (day.status === 'missed') {
      h += '<div class="result bad"><h3>❌ 못 한 항목</h3><ul>';
      day.missed.forEach(function (id) { h += '<li>' + esc(describe(sim.subs, id)) + '</li>'; });
      h += '</ul><div class="hint">못 한 항목은 다음 날 그 과목 맨 앞에 나와요.</div>' +
        '<label class="field" style="margin-top:12px"><span>못 한 이유 메모 (선택)</span><textarea data-act="memo" placeholder="예: 학원 보강이 있었음">' + esc(rec.memo || '') + '</textarea></label></div>';
    } else if (day.status === 'done') {
      h += '<div class="result ok"><h3>✅ 이 날 할 일을 모두 해냈어요!</h3></div>';
    }
    h += '<div class="btnrow">' +
      '<button class="bigbtn ghost" data-act="edit">' + (editing ? '고치기 끝' : '체크 고치기') + '</button>' +
      (d === t ? '<button class="bigbtn ghost" data-act="reopen">마감 취소</button>' : '') + '</div>';
    return h + backupTip;
  }

  var HOW = '<div class="howbox"><ol><li>교재의 개념 설명 부분을 천천히 읽기</li><li>그날 배운 것과 푼 문제를 머릿속으로 정리하기</li>' +
    '<li>빈 종이에 수업 내용을 순서대로 소리 내어 설명하기</li><li>문제는 풀이 단계마다 왜 그렇게 하는지 이유를 말하며 설명하기</li></ol></div>';
  function fmtMin(m) { m = Math.round(m); return m >= 60 ? Math.floor(m / 60) + '시간' + (m % 60 ? ' ' + m % 60 + '분' : '') : m + '분'; }
  var KIND = { skim: '훑어보기', merged: '훑어보기+3일', spaced: '간격 복습', five: '5단계 복습', weekly: '이번 주 복습' };
  // 오늘 화면의 복습 목록
  function reviewSummary(p, sim, day, rec) {
    var list = L.groupReviews(sim.subs, day.reviews || [], day.date, sim.revDue);
    var total = 0, left = 0;
    list.forEach(function (e) {
      e.min = L.reviewMinutes(p, sim.subs, e); total += e.min;
      if (!e.ids.every(function (id) { return rec.checked && rec.checked[id]; })) left += e.min;
    });
    return { list: list, total: total, left: left };
  }
  function renderReviews(p, sim, day, rec, editing) {
    var rs = reviewSummary(p, sim, day, rec), list = rs.list;
    var h = '<h2 class="zone">🔁 복습' + (list.length ? '<span class="sum">⏱ 오늘 총 ' + fmtMin(rs.total) +
      (day.status !== 'future' && rs.left && rs.left < rs.total ? ' · 남은 ' + fmtMin(rs.left) : '') + '</span>' : '') + '</h2>';
    if (!list.length) return h + '<p class="hint">오늘은 복습이 없어요.</p>';
    h += '<div class="sec revsec"><div class="revlist">';
    list.forEach(function (e) {
      var od = e.ids.some(function (id) { return (day.overdue || []).indexOf(id) >= 0; });
      var on = day.status !== 'future' && e.ids.every(function (id) { return rec.checked && rec.checked[id]; });
      var cls = 'chk' + (on ? ' on' : '') + (od ? ' overdue' : '');
      if (day.status === 'future' || (day.closed && !editing)) cls += ' locked';
      if (day.closed && !on) cls += ' miss';
      var key = e.ids[0];
      h += '<div><div class="revrow"><button class="' + cls + '" data-act="togglerev" data-ids="' + esc(e.ids.join(',')) + '"><span class="box">✓</span><span class="lbl">' +
        '<span class="kind">' + (od ? '⚠️ 밀린 복습' : KIND[e.kind] || '복습') + '</span><b>' + esc(e.title) + '</b>' + (e.detail ? '<small>' + esc(e.detail) + '</small>' : '') + '</span>' +
        '<span class="mins" style="margin-left:auto">⏱ ' + fmtMin(e.min) + '</span></button>' +
        (e.how ? '<button class="howbtn" data-act="how" data-k="' + esc(key) + '">📖 방법</button>' : '') + '</div>' +
        (e.how && ui.how && ui.how[key] ? HOW : '') + '</div>';
    });
    return h + '</div></div>';
  }

  /* ---------- 달력 / 목록 화면 ---------- */
  var ICON = { done: '✅', missed: '❌', rest: '💤', open: '✏️', future: '', empty: '－', paused: '⏸️' };
  function renderCalendar() {
    var p = plan(), t = today();
    var sim = L.simulate(p, t, p.end);
    var byDate = {};
    sim.days.forEach(function (d) { byDate[d.date] = d; });
    var sel = ui.calDate || (t < p.start ? p.start : t > p.end ? p.end : t);

    // 과목별 진행 상황
    var h = '<div class="sec"><h2>📈 과목별 진행 상황</h2><div class="hint">' + korDate(p.start) + ' ~ ' + korDate(p.end) +
      ' · 앞으로 계획대로 한다고 가정한 예상이에요</div>';
    L.forecast(p, t).forEach(function (f) {
      var u = esc(f.unitLabel), pct = f.total ? Math.round(f.doneNow / f.total * 100) : 0;
      h += '<div class="fc"><b>' + esc(f.s.name) + '</b> <span class="hint">지금 ' + f.doneNow + '/' + f.total + u + ' 완료 (' + pct + '%)</span>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="line">';
      if (f.doneNow >= f.total && f.total) h += '<span class="ok">🎉 모두 끝냈어요!</span>';
      else if (!f.finishDate) h += '<span class="bad">하루 분량이 0이라 끝낼 수 없어요</span>';
      else if (f.overUnits) h += '종료일까지 <b>' + f.byEnd + '/' + f.total + u + '</b> 예정 · <span class="bad">' + f.overUnits + u + ' 초과</span><br>' +
        '<span class="hint">이대로면 ' + korDate(f.finishDate) + '에 끝나요 (종료일보다 ' + f.overDays + '일 늦음)</span>';
      else h += '<span class="ok">✅ 종료일 안에 끝낼 수 있어요</span> · 예상 완료 <b>' + korDate(f.finishDate) + '</b>' +
        (f.spareDays ? ' <span class="hint">(' + f.spareDays + '일 여유)</span>' : '');
      h += '</div></div>';
    });
    h += '</div>';

    // 달력
    h += '<div class="calwrap"><div>';
    h += '<div class="legend"><span>✅ 다 함</span><span>❌ 못 한 게 있음</span><span>💤 쉬는 날</span><span>✏️ 오늘(진행 중)</span><span>⏸️ 일시정지</span><span>빈칸: 아직 안 옴</span></div>';
    var m = p.start.slice(0, 7);
    while (m <= p.end.slice(0, 7)) {
      var first = m + '-01', wd = L.weekday(first);
      h += '<div class="month"><h3>' + (+m.slice(0, 4)) + '년 ' + (+m.slice(5)) + '월</h3><div class="cal">';
      '일월화수목금토'.split('').forEach(function (c) { h += '<div class="wd">' + c + '</div>'; });
      for (var i = 0; i < wd; i++) h += '<div></div>';
      for (var d = first; d.slice(0, 7) === m; d = L.addDays(d, 1)) {
        var day = byDate[d], n = +d.slice(8);
        if (!day) { h += '<div class="cell out"><span class="n">' + n + '</span></div>'; continue; }
        h += '<button class="cell s-' + day.status + (d === t ? ' today' : '') + (d === sel ? ' sel' : '') + '" data-act="calpick" data-date="' + d + '">' +
          '<span class="n">' + n + '</span><span class="i">' + (ICON[day.status] || '') + '</span></button>';
      }
      h += '</div></div>';
      var y = +m.slice(0, 4), mo = +m.slice(5) + 1;
      if (mo > 12) { mo = 1; y++; }
      m = y + '-' + L.pad(mo);
    }
    h += '</div>' + (wide() ? '<div class="calside">' + renderDayDetail(p, t, sim, byDate[sel]) + '</div>' : '') + '</div>';
    return h;
  }

  /* ---------- 통계 화면 ---------- */
  function pct(x) { return x == null ? '—' : Math.round(x * 100) + '%'; }
  function renderStats() {
    var p = plan(), t = today(), st = L.stats(p, t);
    var h = '';
    if (!st.days) h += '<div class="notice">아직 마감한 날이 없어요. 하루를 마감하면 통계가 쌓여요.</div>';
    h += '<div class="tiles">' +
      '<div class="tile"><div class="k">전체 달성률</div><div class="v">' + pct(st.rate) + '</div><div class="d">해낸 항목 ' + st.doneItems + ' / ' + st.items + '개</div></div>' +
      '<div class="tile"><div class="k">다 해낸 날</div><div class="v">' + st.perfectDays + '<small style="font-size:22px"> / ' + st.days + '일</small></div><div class="d">' + (st.dayRate == null ? '쉬는 날은 빼고 셌어요' : '마감한 날의 ' + pct(st.dayRate)) + '</div></div>' +
      '<div class="tile"><div class="k">연속으로 다 해낸 날</div><div class="v">🔥 ' + st.streak + '일</div><div class="d">최고 기록 ' + st.bestStreak + '일 · 쉬는 날은 연속을 안 끊어요</div></div></div>';

    h += '<div class="sec"><h2>📚 과목별 달성률</h2>';
    st.subjects.forEach(function (q) {
      h += '<div class="srow"><div class="top"><b>' + esc(q.s.name) + '</b><span>' + pct(q.rate) + ' <span class="hint">(' + q.done + '/' + q.shown + '개)</span></span></div>' +
        '<div class="bar"><i style="width:' + (q.rate == null ? 0 : Math.round(q.rate * 100)) + '%"></i></div>' +
        '<div class="hint">할 일이 있던 ' + q.activeDays + '일 중 다 해낸 날 ' + q.perfectDays + '일</div></div>';
    });
    h += '</div>';

    var order = st.subjects.slice().sort(function (a, b) { return b.missedDays - a.missedDays || b.missedItems - a.missedItems; });
    var max = Math.max.apply(null, order.map(function (q) { return q.missedDays; }).concat([1]));
    h += '<div class="sec"><h2>⏳ 과목별 밀린 양</h2><p class="hint" style="margin-top:0">어느 과목이 자주 밀리는지 보여줘요. 밀린 날이 많은 순서예요.</p>';
    order.forEach(function (q) {
      h += '<div class="srow"><div class="top"><b>' + esc(q.s.name) + '</b><span>밀린 날 <b>' + q.missedDays + '일</b></span></div>' +
        '<div class="bar"><i style="width:' + Math.round(q.missedDays / max * 100) + '%;background:var(--orange)"></i></div>' +
        '<div class="hint">못 한 항목 누적 ' + q.missedItems + '개' + ' · 지금 밀려 있는 항목 ' + q.backlog + '개' + '</div></div>';
    });
    return h + '</div>';
  }

  function wide() { return window.matchMedia('(orientation:landscape) and (min-width:900px)').matches; }
  // 세로 화면: 날짜를 누르면 팝업으로 보여주기
  function dayModal() {
    var p = plan(), t = today();
    var sim = L.simulate(p, t, p.end);
    var day = sim.days.filter(function (d) { return d.date === ui.calDate; })[0];
    return '<div class="modal" data-act="closemodal"><div style="width:100%;max-width:640px" data-stop="1">' + withClose(renderDayDetail(p, t, sim, day)) + '</div></div>';
  }

  function withClose(html) {
    var row = '<div class="btnrow" style="justify-content:flex-start">', close = '<button class="btn" data-act="closemodal">닫기</button>';
    if (html.indexOf(row) >= 0) return html.replace(row, row + close);
    return html.replace(/<\/div>$/, row + close + '</div></div>');
  }
  // 묶음별로 모아서 "5강: 강의 듣기, 복습" 처럼
  function groupLines(x, ids) {
    var order = [], by = {};
    ids.forEach(function (id) {
      var q = id.split('|'), u = +q[1];
      if (!by[u]) { by[u] = []; order.push(u); }
      by[u].push(x.units[u].items[+q[2]].label);
    });
    return order.map(function (u) {
      var unit = x.units[u], labels = by[u];
      var same = labels.length === 1 && labels[0] === unit.title;
      return esc(unit.title) + (unit.sub ? ' <span class="hint">' + esc(unit.sub) + '</span>' : '') + (same ? '' : ' — ' + esc(labels.join(', ')));
    });
  }

  function renderDayDetail(p, t, sim, day) {
    if (!day) return '';
    var st = STATUS[day.status] || ['b-empty', ''];
    var rec = p.days[day.date] || {};
    var h = '<div class="sec detail"><h3>' + korDate(day.date) + '</h3><span class="badge ' + st[0] + '">' + st[1] + '</span>';
    if (day.rest) h += '<p class="hint">💤 쉬는 날이에요. 과목 진도는 멈추고, 복습과 영단어만 해요.</p>';
    var future = day.status === 'future' || (day.rest && day.date > t);
    if (future && !day.rest) h += '<p class="hint">지금 진도를 기준으로, 그때까지 계획대로 했을 때의 예상 할 일이에요.</p>';
    var doneSet = day.date >= t ? null : L.simulate(p, t, day.date).done;
    sim.subs.forEach(function (x) {
      var ids = day.shown[x.s.id] || [];
      if (!ids.length) return;
      h += '<div class="dsub"><h4>' + esc(x.s.name) + '</h4><ul>';
      if (future || day.date === t) {
        var todayDone = day.date === t ? (rec.checked || {}) : {};
        var mk = function (id) { return todayDone[id] ? '✅ ' : (future ? '• ' : '⬜ '); };
        var lines = [];
        ids.forEach(function (id) { lines.push(mk(id) + groupLines(x, [id])[0]); });
        h += future ? groupLines(x, ids).map(function (l) { return '<li>• ' + l + '</li>'; }).join('') : lines.map(function (l) { return '<li>' + l + '</li>'; }).join('');
      } else {
        var did = ids.filter(function (id) { return doneSet.has(id); });
        var miss = ids.filter(function (id) { return !doneSet.has(id); });
        if (did.length) h += groupLines(x, did).map(function (l) { return '<li><span class="ok">✓</span> ' + l + '</li>'; }).join('');
        if (miss.length) h += groupLines(x, miss).map(function (l) { return '<li><span class="bad">✗</span> ' + l + '</li>'; }).join('');
      }
      h += '</ul></div>';
    });
    var rl = L.groupReviews(sim.subs, day.reviews || [], day.date, sim.revDue);
    if (rl.length) {
      var recD = p.days[day.date] || {}, past = day.date < t || day.closed;
      h += '<div class="dsub"><h4>🔁 복습</h4><ul>' + rl.map(function (e) {
        var ok = e.ids.every(function (id) { return recD.checked && recD.checked[id]; });
        var od = e.ids.some(function (id) { return (day.overdue || []).indexOf(id) >= 0; });
        var mark = future ? '• ' : ok ? '<span class="ok">✓</span> ' : past ? '<span class="bad">✗</span> ' : '⬜ ';
        return '<li>' + mark + (od ? '<span class="bad">[밀림]</span> ' : '') + esc(e.title) + (e.detail ? ' <span class="hint">' + esc(e.detail) + '</span>' : '') + '</li>';
      }).join('') + '</ul></div>';
    }
    if (!day.items.length && !day.rest) h += '<p class="hint">이 날은 할 일이 없어요.</p>';
    if (rec.memo) h += '<div class="memo">📝 ' + esc(rec.memo) + '</div>';
    var restBtn = '';
    if (day.date >= t && !day.closed) {
      var listed = (p.restDays || []).indexOf(day.date) >= 0;
      if (listed) restBtn = '<button class="btn" data-act="togglerest" data-date="' + day.date + '">쉬는 날 해제</button>';
      else if (day.rest) h += '<p class="hint">매주 ' + WD[L.weekday(day.date)] + '요일은 쉬는 날이에요. 설정에서 바꿀 수 있어요.</p>';
      else restBtn = '<button class="btn" data-act="togglerest" data-date="' + day.date + '">💤 이 날을 쉬는 날로</button>';
    }
    if (day.date <= t) h += '<div class="btnrow" style="justify-content:flex-start"><button class="btn pri" data-act="opendate" data-date="' + day.date + '">' +
      (day.date === t ? '오늘 화면에서 체크하기' : '이 날 열기 (메모·체크 고치기)') + '</button>' + restBtn + '</div>';
    else h += '<div class="btnrow" style="justify-content:flex-start">' + (day.rest ? '' : '<button class="btn" data-act="opendate" data-date="' + day.date + '">크게 보기</button>') + restBtn + '</div>';
    return h + '</div>';
  }

  function describe(subs, id) {
    if (/^[RFSW]\|/.test(id)) return '복습 · ' + L.reviewInfo(subs, id).title;
    var p = id.split('|');
    for (var i = 0; i < subs.length; i++) {
      if (subs[i].s.id === p[0]) {
        var u = subs[i].units[+p[1]]; if (!u) return id;
        var it = u.items[+p[2]];
        return subs[i].s.name + ' · ' + u.title + (it && it.label !== u.title ? ' · ' + it.label : '');
      }
    }
    return id;
  }

  /* ---------- 설정 화면 ---------- */
  function renderSettings() {
    var p = plan();
    var h = '';
    h += '<div class="sec"><h2>📲 앱으로 설치</h2>' + installHTML() + '</div>';
    var th = document.documentElement.getAttribute('data-theme');
    h += '<div class="sec"><h2>🎨 화면 디자인</h2>' +
      [['samsung', '삼성 스타일', '흰 바탕, 검정 글씨, 검정 알약 모양 버튼'],
       ['apple', '애플 스타일', '연회색 바탕에 흰 카드, 파란 알약 버튼, 반투명 아래 탭'],
       ['classic', '기본', '처음 디자인 (파란색 포인트, 둥근 카드)']].map(function (o) {
        return '<button class="radio ' + (th === o[0] ? 'on' : '') + '" data-act="theme" data-v="' + o[0] + '"><span class="dot"></span><span><b>' + o[1] + '</b><br><span class="hint">' + o[2] + '</span></span></button>';
      }).join('') +
      '<p class="hint" style="margin:0">디자인만 바뀌고 기록과 기능은 그대로예요. 언제든 다시 바꿀 수 있어요.</p></div>';
    h += '<div class="sec"><h2>📆 지금 계획 「' + esc(p.name) + '」 기간</h2>' +
      '<label class="field"><span>계획 이름</span><input id="pName" value="' + esc(p.name) + '"></label>' +
      '<div class="grid2"><label class="field"><span>시작일</span><input type="date" id="pStart" value="' + p.start + '"></label>' +
      '<label class="field"><span>종료일</span><input type="date" id="pEnd" value="' + p.end + '"></label></div>' +
      '<button class="btn pri" data-act="saveplan">기간 저장</button></div>';

    h += '<div class="sec"><h2>🗂️ 계획 관리</h2>' +
      '<p class="hint" style="margin-top:0">방학용, 학기용처럼 계획을 여러 개 만들어 두고 골라 쓸 수 있어요. 고르지 않은 계획은 <b>일시정지</b>돼서 진도가 그대로 멈춰 있고, 다시 고르면 멈춘 곳부터 이어져요.</p>';
    data.plans.forEach(function (x) {
      var on = x.id === data.activePlanId;

  function wdText(s) {

    var out = []; for (var k = 1; k <= 7; k++) if (s.weekdays[k % 7]) out.push(WD[k % 7]);
    return out.length ? out.join('·') : '요일 없음';
  }

  function readDraft() {

      '<div class="pick" style="margin-bottom:10px"><button class="wkb ' + (s.skim ? 'on' : '') + '" data-act="subflag" data-k="skim">지난번 훑어보기</button>' +

  function readPeriods() {
    (draft.periods || []).forEach(function (per, i) {
      var f = document.querySelector('[data-pf="' + i + '"]'), t = document.querySelector('[data-pt="' + i + '"]');
      if (f) per.from = f.value; if (t) per.to = t.value;
      for (var k = 0; k < 7; k++) {
        var e = document.querySelector('[data-pd="' + i + '-' + k + '"]');

  function periodsInvalid(s) {
    var ps = s.periods || [];
    for (var i = 0; i < ps.length; i++) {
      if (!ps[i].from || !ps[i].to) return (i + 1) + '번째 기간의 날짜를 정해 주세요';
      if (ps[i].from > ps[i].to) return (i + 1) + '번째 기간의 시작일이 종료일보다 뒤예요';
      for (var j = 0; j < i; j++) if (ps[i].from <= ps[j].to && ps[j].from <= ps[i].to) return (j + 1) + '번째와 ' + (i + 1) + '번째 기간이 겹쳐요';

  }
  function readAnyDraft() { if (draft.type === 'table') readTableDraft(); else readDraft(); }

      '<button class="radio ' + (s.mode === 'B' ? 'on' : '') + '" data-act="mode" data-mode="B"><span class="dot"></span><span><b>남은 항목 + 원래 다음 일차를 같이</b><br><span class="hint">예: 1일차 남은 항목 + 2일차. 단, 하루를 통째로 못 한 일차는 1자리를 차지해요</span></span></button></div>';
    var rows = s.rows || [];
    h += '<div class="field"><span>진도표 미리보기 (' + rows.length + '일차)</span><div class="preview">';
    rows.slice(0, 40).forEach(function (r, i) {
      h += '<div><b>' + (r.day || i + 1) + '일차</b> ' + esc(r.title) + '<br><span class="hint">' + esc(r.method) + ' ' + esc(r.range) + ' → 체크 ' + r.items.length + '개</span></div>';

  function readTableDraft() {
    draft.name = document.getElementById('tName').value.trim();

  }
  function importCSV(text, fileName, src) {
    var res = L.rowsFromCSV(text);
    if (!res.rows.length) { toast('CSV를 읽지 못했어요: ' + (res.errors[0] || '줄이 없어요')); return; }
    openTableModal(null, { rows: res.rows, errors: res.errors, fileName: fileName, src: src });
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act'), p = plan(), t = today();
    var d = ui.viewDate || t;
    switch (act) {
      case 'tab': ui.tab = b.getAttribute('data-tab'); ui.editDate = null; if (ui.tab !== 'today') ui.viewDate = null; window.scrollTo(0, 0); break;
      case 'calpick': {
        ui.calDate = b.getAttribute('data-date');
        if (!wide()) ui.modal = dayModal;
        break;
      }
      case 'closemodal':
        if (e.target.closest('[data-stop]') && !e.target.closest('button')) return; // 팝업 안쪽 빈 곳을 누른 경우
        ui.modal = null; break;
      case 'opendate': ui.modal = null; ui.viewDate = b.getAttribute('data-date'); if (ui.viewDate === t) ui.viewDate = null; ui.tab = 'today'; window.scrollTo(0, 0); break;
      case 'prev': ui.viewDate = L.addDays(d, -1); ui.editDate = null; break;
      case 'next': ui.viewDate = L.addDays(d, 1); ui.editDate = null; break;
      case 'gotoday': ui.viewDate = null; ui.editDate = null; break;
      case 'toggle': {
        var day = L.dayOf(p, t, d);
        if (!day || day.status === 'future') { toast('아직 오지 않은 날은 체크할 수 없어요'); return; }
        if (day.closed && ui.editDate !== d) { toast('마감된 날이에요. 아래 「체크 고치기」를 눌러 고칠 수 있어요'); return; }
        var id = b.getAttribute('data-id');
        var rec = p.days[d] || {};
        L.setCheck(p, d, id, !(rec.checked && rec.checked[id]));
        save(); break;
      }
      case 'close':
        L.closeDay(p, d, t); save(); toast('마감했어요!');
        if (sundayOn() && L.weekday(d) === 0 && lastBackup() !== t) { ui.modal = backupModal; window.scrollTo(0, 0); }
        break;
      case 'togglerev': {
        var dayR = L.dayOf(p, t, d);
        if (!dayR || dayR.status === 'future') { toast('아직 오지 않은 날은 체크할 수 없어요'); return; }
        if (dayR.closed && ui.editDate !== d) { toast('마감된 날이에요. 아래 「체크 고치기」를 눌러 고칠 수 있어요'); return; }
        var rids = b.getAttribute('data-ids').split(','), recR = p.days[d] || {};
        var allOn = rids.every(function (id) { return recR.checked && recR.checked[id]; });
        rids.forEach(function (id) { L.setCheck(p, d, id, !allOn); });
        save(); break;
      }
      case 'how': { ui.how = ui.how || {}; var hk2 = b.getAttribute('data-k'); ui.how[hk2] = !ui.how[hk2]; break; }
      case 'subflag': { readAnyDraft(); var fk = b.getAttribute('data-k'); draft[fk] = !draft[fk]; render(); return; }
      case 'fivemode': readTableDraft(); draft.fiveStep = b.getAttribute('data-v') === 'five'; render(); return;
      case 'saverevmin': {
        var gv = function (id) { var n = parseInt(document.getElementById(id).value, 10); return isNaN(n) ? null : Math.max(0, n); };
        p.revMin = { skim: gv('rmSkim'), spaced: gv('rmSpaced'), word: gv('rmWord'), five: [gv('rmF2'), gv('rmF3'), gv('rmF4'), gv('rmF5')] };
        save(); toast('복습 시간을 저장했어요'); break;
      }
      case 'resetrevmin': delete p.revMin; save(); toast('기본값으로 되돌렸어요'); break;
      case 'theme': {
        var tv = b.getAttribute('data-v');
        document.documentElement.setAttribute('data-theme', tv);
        try { localStorage.setItem('studyplan.theme', tv); } catch (e2) {}
        setThemeColor();
        toast({ samsung: '삼성 스타일로 바꿨어요', apple: '애플 스타일로 바꿨어요' }[tv] || '기본 디자인으로 바꿨어요'); break;
      }
      case 'pull': L.pull(p, d, b.getAttribute('data-id')); save(); toast('다음 차례 진도를 오늘로 당겨왔어요'); break;
      case 'unpull': L.unpull(p, d, b.getAttribute('data-id')); save(); toast('당겨오기를 취소했어요'); break;
      case 'subwd': {
        readAnyDraft();
        var wi = +b.getAttribute('data-w');
        draft.weekdays = draft.weekdays || [true, true, true, true, true, true, true];
        draft.weekdays[wi] = !draft.weekdays[wi];
        render(); return;
      }
      case 'exportclose': exportJSON(); ui.modal = null; break;
      case 'sundaytoggle': localStorage.setItem(SKEY, sundayOn() ? '0' : '1'); toast(sundayOn() ? '일요일 백업 알림을 켰어요' : '일요일 백업 알림을 껐어요'); break;
      case 'reopen': L.reopenDay(p, d); ui.editDate = null; save(); toast('마감을 취소했어요'); break;
      case 'edit': ui.editDate = ui.editDate === d ? null : d; if (!ui.editDate) toast('고친 내용으로 계획을 다시 계산했어요'); break;
      case 'nextday': data.testToday = L.addDays(data.testToday, 1); ui.viewDate = null; save(); runAutoClose(); break;
      case 'testmode': {
        testMode = !testMode;
        localStorage.setItem(MODEKEY, testMode ? '1' : '0');
        load(); ui.viewDate = null; ui.editDate = null; runAutoClose(true);
        toast(testMode ? '테스트 모드를 켰어요' : '테스트 모드를 껐어요. 실제 데이터로 돌아왔어요'); break;
      }
      case 'testreset':
        if (!confirm('테스트 데이터를 지우고 실제 데이터를 복사해서 새로 시작할까요?')) return;
        localStorage.removeItem(TKEY); load(); runAutoClose(true); break;
      case 'resetall':
        if (!confirm('정말 ' + (testMode ? '테스트' : '실제') + ' 데이터를 모두 지울까요? 되돌릴 수 없어요.')) return;
        localStorage.removeItem(testMode ? TKEY : KEY); load(); ui.viewDate = null; break;
      case 'saveplan': {
        var nm = document.getElementById('pName').value.trim() || '공부 계획';
        var st = document.getElementById('pStart').value, en = document.getElementById('pEnd').value;
        if (!st || !en || st > en) { toast('시작일이 종료일보다 앞이어야 해요'); return; }
        if (st < p.start && st < t && !confirm('시작일을 앞당기면 지난 날들이 「못 한 날」로 자동 마감돼요. 계속할까요?')) return;
        p.name = nm; p.start = st; p.end = en; save(); runAutoClose(); toast('저장했어요'); break;
      }
      case 'addsub': openSubjectModal(null); return;
      case 'addspaced': openSpacedModal(); return;
      case 'editsub': if (findSub(b.getAttribute('data-id')).type === 'table') { openTableModal(findSub(b.getAttribute('data-id')), null); return; }
        openSubjectModal(p.subjects.filter(function (s) { return s.id === b.getAttribute('data-id'); })[0]); return;
      case 'delsub': {
        var s = p.subjects.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0];
        if (!confirm('「' + s.name + '」 과목을 지울까요?')) return;
        p.subjects = p.subjects.filter(function (x) { return x !== s; }); save(); break;
      }
      case 'addtask': readDraft(); draft.tasks.push(''); render(); return;
      case 'deltask': readDraft(); draft.tasks.splice(+b.getAttribute('data-i'), 1); render(); return;
      case 'addper': {
        readAnyDraft();
        draft.periods = draft.periods || [];
        var lastTo = draft.periods.reduce(function (a, x) { return x.to > a ? x.to : a; }, '');
        var from = lastTo ? L.addDays(lastTo, 1) : p.start;
        var dv = draft.daily;
        draft.periods.push({ from: from, to: p.end >= from ? p.end : from, days: [dv, dv, dv, dv, dv, dv, dv] });
        render(); return;
      }
      case 'delper': readAnyDraft(); draft.periods.splice(+b.getAttribute('data-i'), 1); render(); return;
      case 'perfill': {
        readAnyDraft();
        var pr = draft.periods[+b.getAttribute('data-i')], v = pr.days[1];
        pr.days = [v, v, v, v, v, v, v]; render(); return;
      }
      case 'restwd': {
        var w = +b.getAttribute('data-w');
        p.restWeekdays = p.restWeekdays || [];
        var at = p.restWeekdays.indexOf(w);
        if (at >= 0) p.restWeekdays.splice(at, 1); else p.restWeekdays.push(w);
        save(); toast('매주 ' + WD[w] + '요일: ' + (at >= 0 ? '쉬는 날 해제' : '쉬는 날로 지정')); break;
      }
      case 'addrest': {
        var rf = document.getElementById('restFrom').value, rt = document.getElementById('restTo').value || rf;
        if (!rf) { toast('날짜를 골라 주세요'); return; }
        if (rt < rf) { toast('끝 날짜가 시작 날짜보다 앞이에요'); return; }
        var added = 0, skipped = 0;
        p.restDays = p.restDays || [];
        for (var dd = rf; dd <= rt; dd = L.addDays(dd, 1)) {
          if (p.days[dd] && p.days[dd].closed) { skipped++; continue; }
          if (p.restDays.indexOf(dd) < 0) { p.restDays.push(dd); added++; }
        }
        p.restDays.sort(); save();
        toast(added + '일을 쉬는 날로 지정했어요' + (skipped ? ' (이미 마감한 ' + skipped + '일은 제외)' : '')); break;
      }
      case 'delrest': {
        var rd = b.getAttribute('data-date');
        if (p.days[rd] && p.days[rd].closed) { toast('이미 마감한 날은 바꿀 수 없어요'); return; }
        p.restDays = (p.restDays || []).filter(function (x) { return x !== rd; }); save(); break;
      }
      case 'togglerest': {
        var td = b.getAttribute('data-date');
        p.restDays = p.restDays || [];
        if (p.restDays.indexOf(td) >= 0) p.restDays = p.restDays.filter(function (x) { return x !== td; });
        else { p.restDays.push(td); p.restDays.sort(); }
        save(); if (ui.modal === dayModal) ui.modal = dayModal; break;
      }
      case 'useplan': {
        var to = data.plans.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0];
        if (to.id === p.id) return;
        if (!confirm('「' + to.name + '」 계획으로 바꿀까요?\n지금 쓰는 「' + p.name + '」은 오늘부터 일시정지돼요 (진도가 그대로 멈춰요). 나중에 다시 고르면 멈춘 곳부터 이어져요.')) return;
        L.switchPlan(p, to, t); data.activePlanId = to.id;
        ui.viewDate = null; ui.editDate = null; ui.calDate = null;
        save(); runAutoClose(true); ensureRows(); toast('「' + to.name + '」 계획으로 바꿨어요'); break;
      }
      case 'delplan': {
        var dp = data.plans.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0];
        if (!confirm('「' + dp.name + '」 계획과 그 기록을 모두 지울까요? 되돌릴 수 없어요.')) return;
        data.plans = data.plans.filter(function (x) { return x !== dp; }); save(); break;
      }
      case 'newplan': openNewPlan(); return;
      case 'export': exportJSON(); break;
      case 'gobackup': ui.tab = 'settings'; render(); setTimeout(function () {
          var el = document.querySelector('[data-act=export]'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50); return;
      case 'npset': {
        readNp();
        var x = np.subs[+b.getAttribute('data-i')], v = b.getAttribute('data-v');
        x.keep = v !== 'drop'; x.carry = v === 'carry'; render(); return;
      }
      case 'npsave': {
        readNp();
        if (!np.start || !np.end || np.start > np.end) { toast('시작일이 종료일보다 앞이어야 해요'); return; }
        var nm2 = np.name.trim() || (korDate(np.start).split(' (')[0] + ' 계획');
        var newP = L.newPlanFrom(p, t, { id: 'p' + Date.now(), name: nm2, start: np.start, end: np.end, subjects: np.subs });
        L.switchPlan(p, newP, t); // 지금 계획은 오늘부터 일시정지
        data.plans.push(newP); data.activePlanId = newP.id;
        np = null; ui.modal = null; ui.viewDate = null; ui.tab = 'today';
        save(); runAutoClose(true); toast('새 계획 「' + newP.name + '」을 시작했어요!'); break;
      }
      case 'mode': readTableDraft(); draft.mode = b.getAttribute('data-mode'); render(); return;
      case 'savetable': {
        readTableDraft();
        if (!draft.name) { toast('과목 이름을 적어 주세요'); return; }
        if (periodsInvalid(draft)) { toast(periodsInvalid(draft)); return; }
        var isNewT = draft._new; delete draft._new; delete draft._errors;
        if (isNewT) p.subjects.push(draft);
        else p.subjects = p.subjects.map(function (x) { return x.id === draft.id ? draft : x; });
        ui.modal = null; draft = null; save(); toast('저장했어요'); break;
      }
      case 'csvrepo': {
        var fn = document.getElementById('csvName').value.trim();
        if (!fn) { toast('파일 이름을 적어 주세요'); return; }
        fetchCSV(fn).then(function (text) { importCSV(text, fn.split('/').pop(), fn); })
          .catch(function (err) { toast('「' + fn + '」을 불러오지 못했어요. ' + err.message); });
        return;
      }
      case 'cancelsub': ui.modal = null; draft = null; np = null; break;
      case 'savesub': {
        readDraft();
        if (!draft.name) { toast('과목 이름을 적어 주세요'); return; }
        if (draft.total < 1) { toast('총 단위 수는 1 이상이어야 해요'); return; }
        if (periodsInvalid(draft)) { toast(periodsInvalid(draft)); return; }
        draft.tasks = draft.tasks.map(function (x) { return x.trim(); }).filter(Boolean);
        var isNew = draft._new; delete draft._new;
        if (isNew) p.subjects.push(draft);
        else p.subjects = p.subjects.map(function (x) { return x.id === draft.id ? draft : x; });
        ui.modal = null; draft = null; save(); toast('저장했어요'); break;
      }
      default: return;
    }
    render();
  });

  document.addEventListener('input', function (e) {
    var a = e.target.getAttribute('data-act');
    if (a === 'memo') {
      var p = plan(), d = ui.viewDate || today();
      p.days[d] = p.days[d] || { checked: {} };
      p.days[d].memo = e.target.value; save();
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.getAttribute('data-act') === 'importfile') {
      var jf = e.target.files && e.target.files[0]; if (!jf) return;
      var jr = new FileReader();
      jr.onload = function () { importJSON(String(jr.result)); };
      jr.onerror = function () { toast('파일을 읽지 못했어요'); };
      jr.readAsText(jf, 'utf-8');
      e.target.value = '';
      return;
    }
    if (e.target.getAttribute('data-act') === 'csvfile') {
      var f = e.target.files && e.target.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () { importCSV(String(rd.result), f.name, null); };
      rd.onerror = function () { toast('파일을 읽지 못했어요'); };
      rd.readAsText(f, 'utf-8');
      e.target.value = '';
      return;
    }
    if (e.target.getAttribute('data-act') !== 'testdate' || !e.target.value) return;
    var nd = e.target.value, p = plan();
    if (nd < data.testToday) {
      var later = Object.keys(p.days).filter(function (k) { return k > nd; });
      if (later.length && !confirm('날짜를 되돌리면 ' + korDate(nd) + ' 이후의 테스트 기록이 지워져요. 계속할까요?')) { render(); return; }
      later.forEach(function (k) { delete p.days[k]; });
    }
    data.testToday = nd; ui.viewDate = null; save(); runAutoClose(); render();
  });

  // 앱을 켜 둔 채 날짜가 바뀐 경우
  function checkDateChange() { if (ui.lastToday !== today()) { runAutoClose(); ui.viewDate = null; render(); } }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkDateChange(); });
  setInterval(checkDateChange, 60000);
  // 화면을 돌리면 달력 배치 다시 그리기
  var lastWide = wide();
  window.addEventListener('resize', function () {
    if (wide() === lastWide) return;
    lastWide = wide();
    if (ui.modal === dayModal) ui.modal = null;
    if (ui.tab === 'calendar') render();
  });

  /* ---------- PWA: 홈 화면 설치 + 오프라인 ---------- */
  var installEvt = null;
  function standalone() { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
  function installHTML() {
    if (standalone()) return '<p class="hint" style="margin:0">✅ 지금 앱으로 실행 중이에요. 인터넷이 없어도 열려요.</p>';
    var h = '<p class="hint" style="margin-top:0">홈 화면에 아이콘을 추가하면 앱처럼 바로 열 수 있고, <b>인터넷이 없어도</b> 작동해요. 체크 기록은 지금처럼 이 기기에 저장돼요.</p>';
    if (installEvt) return h + '<button class="btn pri" data-act="install">📲 홈 화면에 설치하기</button>';
    return h + '<p class="hint" style="margin:0">설치 버튼이 안 보이면: 크롬 오른쪽 위 <b>⋮ 메뉴 → 「홈 화면에 추가」 또는 「앱 설치」</b>를 눌러 주세요.' +
      (location.protocol === 'file:' ? ' (파일로 직접 연 상태에서는 설치할 수 없어요. GitHub Pages 주소로 열어 주세요.)' : '') + '</p>';
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); installEvt = e;
    if (ui.tab === 'settings' && !ui.modal) render();
  });
  window.addEventListener('appinstalled', function () { installEvt = null; toast('홈 화면에 설치했어요!'); if (ui.tab === 'settings') render(); });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act="install"]'); if (!b || !installEvt) return;
    installEvt.prompt();
    installEvt.userChoice.then(function () { installEvt = null; if (ui.tab === 'settings') render(); });
  });
  window.addEventListener('offline', function () { toast('📴 오프라인이에요. 기록은 그대로 저장돼요.'); });
  window.addEventListener('online', function () { toast('🌐 다시 인터넷에 연결됐어요'); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* 설치 실패해도 앱은 그대로 동작 */ });
    });
  }

  function setThemeColor() {
    var m = document.querySelector('meta[name="theme-color"]');
    var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var th = document.documentElement.getAttribute('data-theme');
    if (m) m.setAttribute('content', th === 'samsung' ? (dark ? '#000000' : '#ffffff') : th === 'apple' ? (dark ? '#000000' : '#f5f5f7') : '#2563eb');
  }
  setThemeColor();

  load(); runAutoClose(); render();
})();
</script>
</body>
</html>
